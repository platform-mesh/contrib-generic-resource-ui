name: pipe
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe:
    uses: platform-mesh/.github/.github/workflows/pipeline-node-app.yml@8ff91e4f07f9cbf1491f15f1c8a94797c16e100f # main
    secrets: inherit
    with:
      imageTagName: ghcr.io/platform-mesh/generic-resource-ui
      componentVersionKey: generic-resource-ui
