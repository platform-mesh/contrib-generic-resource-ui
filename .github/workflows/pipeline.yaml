name: pipe
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe:
    uses: platform-mesh/.github/.github/workflows/pipeline-node-app.yml@5c377e5944acf613950dfe83a13cc7ab3054728f # main
    secrets: inherit
    with:
      imageTagName: ghcr.io/platform-mesh/generic-resource-ui
      componentVersionKey: generic-resource-ui
