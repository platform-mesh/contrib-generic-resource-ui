name: pipe
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe:
    uses: platform-mesh/.github/.github/workflows/pipeline-node-app.yml@560de7e84d61fcd8a8adfe8f9888a9f0f9f71dd8 # main
    secrets: inherit
    with:
      imageTagName: ghcr.io/platform-mesh/generic-resource-ui
      componentVersionKey: generic-resource-ui
