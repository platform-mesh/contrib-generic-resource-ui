version: '3'

vars:
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  KIND_CLUSTER: '{{.KIND_CLUSTER | default "platform-mesh"}}'
  DEPLOYMENT_NAME: '{{.DEPLOYMENT_NAME | default "generic-resource-ui"}}'
  DEPLOYMENT_NAMESPACE: '{{.DEPLOYMENT_NAMESPACE | default "platform-mesh-system"}}'
  IMAGE_REPO: ghcr.io/platform-mesh/generic-resource-ui
  CONFIG_NAME: '{{.CONFIG_NAME | default "kind"}}'
  SERVICE_ACCOUNT: '{{.SERVICE_ACCOUNT | default "platform-mesh-admin"}}'
  SA_NAMESPACE: '{{.SA_NAMESPACE | default "platform-mesh-system"}}'

tasks:
  ## Configuration Management
  config:
    desc: "Switch to a specific config file"
    cmds:
      - ./scripts/switch-config.sh {{.CONFIG_NAME}}

  config:kind:
    desc: "Switch to kind cluster config with token from .secret/token"
    cmds:
      - ./scripts/switch-config.sh kind --token=$(task read-token)

  config:list:
    desc: "List available config files"
    cmds:
      - |
        echo "Available configs (.config/):"
        for f in .config/config.*.json; do
          name=$(basename "$f" | sed 's/config\.\(.*\)\.json/\1/')
          if [ "$name" != "*" ]; then
            kind=$(jq -r '.resourceDefinition.kind // "unknown"' "$f")
            url=$(jq -r '.portalContext.crdGatewayApiUrl // "unknown"' "$f")
            echo "  $name: $kind @ $url"
          fi
        done
  read-token:
    desc: "Read token from .secret/token file"
    silent: true
    cmds:
      - cat .secret/token 2>/dev/null || echo ""

  ## Development
  dev:
    desc: "Start dev server (CONFIG_NAME=kind, GATEWAY=url)"
    vars:
      GATEWAY: '{{.GATEWAY | default ""}}'
    cmds:
      - |
        if [ ! -s .secret/token ]; then
          echo "Error: No token found in .secret/token"
          echo ""
          echo "Add your token manually:"
          echo "  echo 'your-jwt-token' > .secret/token"
          exit 1
        fi
      - |
        ARGS="{{.CONFIG_NAME}}"
        if [ -n "{{.GATEWAY}}" ]; then
          ARGS="$ARGS --gateway={{.GATEWAY}}"
        fi
        ./scripts/switch-config.sh $ARGS
      - task: start

  dev:local:
    desc: "Start with local gateway (localhost:8080)"
    cmds:
      - task: dev
        vars:
          GATEWAY: "http://localhost:8080/graphql"

  ## Build
  build:
    desc: "Build the Angular application"
    cmds:
      - npm run build

  lint:
    desc: "Run linting"
    cmds:
      - npm run lint

  lint:fix:
    desc: "Run linting with auto-fix"
    cmds:
      - npm run lint:fix

  test:
    desc: "Run unit tests"
    cmds:
      - npm run test:unit

  test:cov:
    desc: "Run tests with coverage"
    cmds:
      - npm run test:cov

  docker-build:
    desc: "Build Docker image"
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t {{.IMAGE_REPO}}:latest ."

  docker:kind:
    desc: "Build container image, load into kind cluster, and restart deployment"
    vars:
      KIND_CONTEXT: kind-{{.KIND_CLUSTER}}
      IMAGE_NAME:
        sh: kubectl --context {{.KIND_CONTEXT}} get deployment {{.DEPLOYMENT_NAME}} -n {{.DEPLOYMENT_NAMESPACE}} -o jsonpath='{.spec.template.spec.containers[0].image}'
    cmds:
      - echo "Building image {{.IMAGE_NAME}} using {{.CONTAINER_RUNTIME}}"
      - "{{.CONTAINER_RUNTIME}} build -t {{.IMAGE_NAME}} ."
      - |
        if [ "{{.CONTAINER_RUNTIME}}" = "podman" ]; then
          {{.CONTAINER_RUNTIME}} save {{.IMAGE_NAME}} -o /tmp/kind-image.tar
          kind load image-archive /tmp/kind-image.tar --name {{.KIND_CLUSTER}}
          rm -f /tmp/kind-image.tar
        else
          kind load docker-image {{.IMAGE_NAME}} --name {{.KIND_CLUSTER}}
        fi
      - kubectl --context {{.KIND_CONTEXT}} rollout restart deployment/{{.DEPLOYMENT_NAME}} -n {{.DEPLOYMENT_NAMESPACE}}
      - echo "Waiting for rollout to complete..."
      - kubectl --context {{.KIND_CONTEXT}} rollout status deployment/{{.DEPLOYMENT_NAME}} -n {{.DEPLOYMENT_NAMESPACE}} --timeout=120s
      - echo "Deployment ready!"

  validate:
    desc: "Run lint and tests"
    cmds:
      - task: lint
      - task: test

  start:
    desc: "Start development server"
    cmds:
      - npm start

  format:
    desc: "Format code with prettier"
    cmds:
      - npm run format

  ## Troubleshooting & Debugging
  port-forward:gateway:
    desc: "Port-forward to kubernetes-graphql-gateway in kind cluster"
    vars:
      GATEWAY_NAMESPACE: '{{.GATEWAY_NAMESPACE | default "platform-mesh-system"}}'
      GATEWAY_SERVICE: '{{.GATEWAY_SERVICE | default "kubernetes-graphql-gateway"}}'
      LOCAL_PORT: '{{.LOCAL_PORT | default "8080"}}'
    cmds:
      - echo "Port-forwarding {{.GATEWAY_SERVICE}} to localhost:{{.LOCAL_PORT}}"
      - kubectl port-forward -n {{.GATEWAY_NAMESPACE}} svc/{{.GATEWAY_SERVICE}} {{.LOCAL_PORT}}:80

  test-graphql:
    desc: "Test GraphQL endpoint with introspection query"
    vars:
      GATEWAY_URL:
        sh: jq -r '.portalContext.crdGatewayApiUrl' src/assets/config.json
      TOKEN:
        sh: cat .secret/token 2>/dev/null || jq -r '.token' src/assets/config.json
    cmds:
      - |
        echo "Testing: {{.GATEWAY_URL}}"
        curl -s -X POST "{{.GATEWAY_URL}}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.TOKEN}}" \
          -d '{"query": "{ __schema { queryType { name } } }"}' | jq .

  test-resource:
    desc: "Test fetching the configured resource type"
    vars:
      GATEWAY_URL:
        sh: jq -r '.portalContext.crdGatewayApiUrl' src/assets/config.json
      TOKEN:
        sh: cat .secret/token 2>/dev/null || jq -r '.token' src/assets/config.json
      GROUP:
        sh: jq -r '.resourceDefinition.group | gsub("[.-]"; "_")' src/assets/config.json
      VERSION:
        sh: jq -r '.resourceDefinition.version' src/assets/config.json
      KIND:
        sh: jq -r '.resourceDefinition.kind' src/assets/config.json
    cmds:
      - |
        echo "Testing: {{.KIND}} @ {{.GATEWAY_URL}}"
        QUERY="query { {{.GROUP}} { {{.VERSION}} { {{.KIND}} { metadata { name } } } } }"
        echo "Query: $QUERY"
        curl -s -X POST "{{.GATEWAY_URL}}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.TOKEN}}" \
          -d "{\"query\": \"$QUERY\"}" | jq .

  show-config:
    desc: "Show current active config"
    cmds:
      - |
        echo "=== Current Config ==="
        jq 'del(.token)' src/assets/config.json
        echo ""
        echo "=== Token Source ==="
        if [ -s .secret/token ]; then
          TOKEN=$(cat .secret/token)
          echo "From: .secret/token (${#TOKEN} chars)"
        else
          TOKEN=$(jq -r '.token' src/assets/config.json)
          echo "From: config.json (${#TOKEN} chars)"
        fi
        echo "Preview: ${TOKEN:0:50}..."
        echo ""
        echo "=== JWT Payload (if valid) ==="
        echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq . 2>/dev/null || echo "(not a valid JWT or cannot decode)"

  ## E2E Visual Testing
  test:e2e:
    desc: "Run all e2e tests"
    cmds:
      - npx playwright test

  test:e2e:headed:
    desc: "Run e2e tests in headed mode (see browser)"
    cmds:
      - npx playwright test --headed

  test:e2e:ui:
    desc: "Open Playwright UI for interactive testing"
    cmds:
      - npx playwright test --ui

  screenshots:
    desc: "Take visual layout screenshots (starts server, cleans, captures, stops)"
    vars:
      SERVER_PID:
        sh: lsof -ti :4200 2>/dev/null || echo ""
    cmds:
      - |
        # Clean previous screenshots
        rm -rf test-results/screenshots/*
        mkdir -p test-results/screenshots
      - |
        # Check if server is already running
        if [ -n "{{.SERVER_PID}}" ]; then
          echo "Dev server already running (PID: {{.SERVER_PID}})"
          SERVER_STARTED=false
        else
          echo "Starting dev server..."
          npm start &
          SERVER_STARTED=true
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -k -s -o /dev/null -w "" https://localhost:4200/ui/generic-resource/ 2>/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        fi
      - |
        # Run the screenshot tests
        npx playwright test e2e/visual-layout.spec.ts --reporter=list
      - |
        echo ""
        echo "Screenshots saved to: test-results/screenshots/"
        ls -la test-results/screenshots/ 2>/dev/null || echo "No screenshots found"

  screenshots:keep-server:
    desc: "Take screenshots without stopping server (for iteration)"
    cmds:
      - rm -rf test-results/screenshots/*
      - mkdir -p test-results/screenshots
      - npx playwright test e2e/visual-layout.spec.ts --reporter=list
      - |
        echo ""
        echo "Screenshots saved to: test-results/screenshots/"
        ls -la test-results/screenshots/

  screenshots:open:
    desc: "Open screenshots directory"
    cmds:
      - |
        open test-results/screenshots/ 2>/dev/null || xdg-open test-results/screenshots/ 2>/dev/null || echo "Screenshots at: test-results/screenshots/"

  screenshots:clean:
    desc: "Clean screenshot directory"
    cmds:
      - rm -rf test-results/screenshots/*
      - echo "Screenshot directory cleaned"

  fixtures:capture:
    desc: "Capture schema and sample data from live gateway to fixtures"
    vars:
      RESOURCE_NAME: '{{.RESOURCE_NAME | default ""}}'
    cmds:
      - ./scripts/capture-fixture.sh {{.RESOURCE_NAME}}

  fixtures:capture-all:
    desc: "Capture fixtures for all configs in src/assets/configs/"
    cmds:
      - |
        for config in src/assets/configs/*.json; do
          name=$(basename "$config" .json)
          echo "=== Capturing: $name ==="
          ./scripts/capture-fixture.sh "$name" || echo "Failed to capture $name"
          echo ""
        done

  screenshots:dashboard:
    desc: "Take dashboard screenshots (serve-local with mocked data)"
    vars:
      SERVER_PID:
        sh: lsof -ti :4200 2>/dev/null || echo ""
    cmds:
      - |
        rm -rf test-results/screenshots/dashboard/*
        mkdir -p test-results/screenshots/dashboard
      - |
        if [ -n "{{.SERVER_PID}}" ]; then
          echo "Dev server already running (PID: {{.SERVER_PID}})"
        else
          echo "Starting dev server (serve-local)..."
          npx ng serve --configuration=serve-local --serve-path=/ui/generic-resource &
          for i in $(seq 1 30); do
            if curl -k -s -o /dev/null -w "" https://localhost:4200/ui/generic-resource/ 2>/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        fi
      - |
        npx playwright test e2e/dashboard-screenshots.spec.ts --reporter=list
      - |
        echo ""
        echo "Dashboard screenshots saved to: test-results/screenshots/dashboard/"
        ls -la test-results/screenshots/dashboard/ 2>/dev/null || echo "No screenshots found"

  screenshots:offline:
    desc: "Take screenshots with mocked GraphQL (no gateway needed)"
    vars:
      SERVER_PID:
        sh: lsof -ti :4200 2>/dev/null || echo ""
    cmds:
      - |
        # Clean previous offline screenshots
        rm -rf test-results/screenshots/offline/*
        mkdir -p test-results/screenshots/offline
      - |
        # Check if server is already running
        if [ -n "{{.SERVER_PID}}" ]; then
          echo "Dev server already running (PID: {{.SERVER_PID}})"
        else
          echo "Starting dev server..."
          npm start &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -k -s -o /dev/null -w "" https://localhost:4200/ui/generic-resource/ 2>/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        fi
      - |
        # Run offline screenshot tests
        npx playwright test e2e/offline-screenshots.spec.ts --reporter=list
      - |
        echo ""
        echo "Offline screenshots saved to: test-results/screenshots/offline/"
        echo ""
        echo "Resource directories:"
        ls -d test-results/screenshots/offline/*/ 2>/dev/null | while read dir; do
          count=$(ls -1 "$dir"/*.png 2>/dev/null | wc -l)
          echo "  $(basename "$dir"): $count screenshots"
        done

  test:e2e:namespace:
    desc: "Run namespace switching e2e tests (mocked GraphQL)"
    vars:
      SERVER_PID:
        sh: lsof -ti :4200 2>/dev/null || echo ""
    cmds:
      - |
        mkdir -p test-results/screenshots/namespace-switching
      - |
        # Check if server is already running
        if [ -n "{{.SERVER_PID}}" ]; then
          echo "Dev server already running (PID: {{.SERVER_PID}})"
        else
          echo "Starting dev server..."
          npm start &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -k -s -o /dev/null -w "" https://localhost:4200/ui/generic-resource/ 2>/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        fi
      - |
        # Run namespace switching tests
        npx playwright test e2e/namespace-switching.spec.ts --reporter=list
      - |
        echo ""
        echo "Screenshots saved to: test-results/screenshots/namespace-switching/"
        ls -la test-results/screenshots/namespace-switching/ 2>/dev/null || echo "No screenshots found"

  test:e2e:detail:
    desc: "Run detail view rendering e2e tests (mocked GraphQL with Component fixture)"
    vars:
      SERVER_PID:
        sh: lsof -ti :4200 2>/dev/null || echo ""
    cmds:
      - |
        mkdir -p test-results/screenshots/detail-view
      - |
        # Check if server is already running
        if [ -n "{{.SERVER_PID}}" ]; then
          echo "Dev server already running (PID: {{.SERVER_PID}})"
        else
          echo "Starting dev server..."
          npm start &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -k -s -o /dev/null -w "" https://localhost:4200/ui/generic-resource/ 2>/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        fi
      - |
        # Run detail view tests
        npx playwright test e2e/detail-view-rendering.spec.ts --reporter=list
      - |
        echo ""
        echo "Screenshots saved to: test-results/screenshots/detail-view/"
        ls -la test-results/screenshots/detail-view/ 2>/dev/null || echo "No screenshots found"

  screenshots:multi:
    desc: "Take screenshots for all resource types in src/assets/configs/"
    vars:
      SERVER_PID:
        sh: lsof -ti :4200 2>/dev/null || echo ""
    cmds:
      - |
        # Clean previous screenshots
        rm -rf test-results/screenshots/*
        mkdir -p test-results/screenshots
      - |
        # Check if server is already running
        if [ -n "{{.SERVER_PID}}" ]; then
          echo "Dev server already running (PID: {{.SERVER_PID}})"
        else
          echo "Starting dev server..."
          npm start &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -k -s -o /dev/null -w "" https://localhost:4200/ui/generic-resource/ 2>/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        fi
      - |
        # Run multi-resource screenshot tests
        npx playwright test e2e/multi-resource-screenshots.spec.ts --reporter=list
      - |
        echo ""
        echo "Screenshots saved to: test-results/screenshots/"
        echo ""
        echo "Resource directories:"
        ls -d test-results/screenshots/*/ 2>/dev/null | while read dir; do
          count=$(ls -1 "$dir"/*.png 2>/dev/null | wc -l)
          echo "  $(basename "$dir"): $count screenshots"
        done
